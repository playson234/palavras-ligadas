:root{--teal1:#3fd0a8;--teal2:#1f9e8c;--ink:#10243a;--purple:#5b2bd1;--yellow:#ffc933;--pink:#ff2bd6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:'Lil','Lilita One','Arial Black',sans-serif;color:#fff}
.stage{position:relative;width:1080px;height:1920px;flex:none;overflow:hidden;transform-origin:center center;background:radial-gradient(ellipse at 50% 18%,#4b2aa6 0%,#2b1475 38%,#150a3d 80%,#0e0629 100%)}
.glow{position:absolute;border-radius:50%;filter:blur(110px);opacity:.5;animation:float 11s ease-in-out infinite alternate}
.g1{width:560px;height:560px;background:#7c3aed;left:-220px;top:420px}.g2{width:520px;height:520px;background:#2dd4bf;right:-240px;top:1000px;animation-delay:-5s;opacity:.28}
@keyframes float{to{transform:translate(60px,-70px) scale(1.12)}}
/* topo */
.bar0{position:absolute;left:36px;right:36px;top:118px;height:74px;display:flex;align-items:center;gap:18px}
.live{flex:none;height:62px;border-radius:32px;background:linear-gradient(180deg,#ff5468,#d92546);border:3px solid rgba(255,255,255,.85);display:flex;align-items:center;gap:12px;padding:0 20px;font-size:32px;box-shadow:0 0 24px rgba(255,60,90,.55)}
.live i{width:14px;height:14px;border-radius:50%;background:#fff;display:block}
.live u{width:3px;height:32px;background:rgba(255,255,255,.6);text-decoration:none}
.timer{flex:none;height:70px;min-width:250px;border-radius:36px;background:linear-gradient(180deg,#241454,#150a3a);border:3px solid rgba(255,255,255,.28);display:flex;align-items:center;gap:14px;padding:0 24px 0 12px;font-size:50px;box-shadow:0 0 30px rgba(124,58,237,.7)}
.ring{width:46px;height:46px;border-radius:50%;position:relative;background:conic-gradient(var(--yellow) var(--p,100%),rgba(255,255,255,.14) 0)}
.ring:after{content:'';position:absolute;inset:8px;border-radius:50%;background:#1a0d45}
.timer.low{border-color:#ff5468;box-shadow:0 0 30px rgba(255,84,104,.9);animation:pulsa .5s infinite alternate}.timer.low .ring{--c:#ff5468;background:conic-gradient(#ff5468 var(--p,100%),rgba(255,255,255,.14) 0)}
@keyframes pulsa{to{transform:scale(1.05)}}
.toast{flex:1;min-width:0;height:62px;border-radius:30px;background:rgba(20,12,60,.78);border:3px solid rgba(110,231,210,.55);color:#9ff2e0;font-size:26px;line-height:56px;padding:0 20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
.brand{position:absolute;left:330px;right:40px;top:206px;height:56px;display:flex;align-items:center;gap:14px;white-space:nowrap}
.brand svg{width:58px;height:58px;flex:none}
.brand .w{font-size:42px;letter-spacing:2px;background:linear-gradient(180deg,#fff,#ffd60a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a1bd0)}
.brand .g{font-size:28px;color:#ffd60a;letter-spacing:1px}
.brand .r{font-size:24px;color:#cbb8ff;background:rgba(255,255,255,.1);border-radius:16px;padding:2px 14px}
/* Sorrisão */
.sor{position:absolute;left:30px;top:228px;width:272px;height:272px;border-radius:50px;overflow:hidden;border:6px solid #fff;box-shadow:0 0 0 5px rgba(255,43,214,.9),0 0 46px rgba(255,43,214,.7);background:#1a0f40;z-index:5;transition:box-shadow .2s}
.sor.fala{box-shadow:0 0 0 5px #ffd60a,0 0 60px rgba(255,214,10,.85)}
#pup{position:absolute;inset:0;transform-origin:50% 95%;animation:sway 4.2s ease-in-out infinite}#pup img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#mo{opacity:0;transition:opacity .07s linear}
@keyframes sway{0%,100%{transform:rotate(-1.4deg) scale(1.02)}50%{transform:rotate(1.4deg) scale(1.045) translateY(-3px)}}
.sor .nm{position:absolute;left:0;right:0;bottom:0;text-align:center;background:rgba(255,43,214,.94);font-size:26px;padding:2px 0;z-index:3}
/* categoria */
.cat{position:absolute;left:322px;right:40px;top:274px;height:196px;border-radius:44px;background:linear-gradient(180deg,#fff,#efe9ff);color:#4a22b8;padding:20px 38px;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 10px 40px rgba(0,0,0,.35)}
.cat:before{content:'';position:absolute;left:-26px;top:86px;width:44px;height:44px;background:#fff;transform:rotate(45deg);border-radius:6px}
.cat small{display:block;font-size:34px;color:#8a78c9}
.cat b{display:block;font-size:112px;line-height:110px;margin-top:4px;white-space:nowrap;overflow:hidden;font-weight:400;letter-spacing:1px}
/* faixa de mensagens (falas do Sorrisão) */
.stat{position:absolute;left:40px;right:40px;top:514px;height:80px;border-radius:40px;background:linear-gradient(180deg,#1c1048,#120833);border:3px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:14px;padding:0 24px;font-size:29px;line-height:32px}
.stat #statT{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stat .c{flex:none;color:#7ee8cf;font-size:44px;background:rgba(255,255,255,.07);border-radius:24px;padding:2px 18px}

 const s=a.currentTime+when;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(a.destination);o.start(s);o.stop(s+d)}
const SOM={
 ding(){tone(880,.15,'triangle',.18);tone(1320,.25,'triangle',.15,.08)},
 primeiro(){[784,988,1175,1568].forEach((f,i)=>tone(f,.18,'triangle',.18,i*.07))},
 tick(){tone(1000,.05,'square',.06)},dica(){tone(1500,.08,'sine',.08)},
 presente(){[660,880,1100,1320].forEach((f,i)=>tone(f,.15,'square',.07,i*.06))},
 combo(n){[523,659,784,988].slice(0,Math.min(4,n)).forEach((f,i)=>tone(f,.14,'triangle',.16,i*.07))},
 fim(){tone(220,.35,'sawtooth',.16);tone(160,.5,'sawtooth',.13,.18)},
 win(){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.16,i*.12))},
 champ(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.17,i*.13))},
 nova(){tone(660,.12,'sine',.12);tone(990,.16,'sine',.1,.1)}
};
// ---------- Sorrisão: boca que mexe (lip sync)
let falandoAnim=false,curChar=' ',curAud=null,an=null,anBuf=null,open=0;
function vogal(ch){ch=(ch||' ').toLowerCase();if('aáàâãä'.includes(ch))return 1;if('oóôõ'.includes(ch))return .85;if('eéê'.includes(ch))return .65;if('iíuúü'.includes(ch))return .5;if('mbp'.includes(ch))return .05;if(' .,!?:;-·'.includes(ch))return .06;return .38}
function alvo(t){if(!falandoAnim)return 0;
 if(curAud&&!curAud.paused&&an){an.getByteTimeDomainData(anBuf);let s=0;for(let i=0;i<anBuf.length;i++){const v=(anBuf[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/anBuf.length)*5.5)}
 return vogal(curChar)*(.82+.18*Math.sin(t/38))}
const MO=$('mo');let moOn=false;function loopBoca(t){open+=(alvo(t)-open)*.55;const on=open>(moOn?.22:.32);if(on!==moOn){moOn=on;MO.style.opacity=on?1:0}requestAnimationFrame(loopBoca)}
requestAnimationFrame(loopBoca);
function talk(on){falandoAnim=on;$('sor').classList.toggle('fala',on)}
document.addEventListener('click',()=>{ac()});
// ---------- faixa de mensagens + fala
const statT=$('statT');let idleMsg='⌨️ Digite sua resposta no chat!';
function setCap(html,cursor,fala){statT.innerHTML=html+(cursor?'<span class="cur"></span>':'');$('stat').classList.toggle('fala',!!fala)}
function showIdle(){if(falando)return;setCap(esc(idleMsg),false,false)}
let FQ=[],falando=false,ultSeg=0,capTimer=0;
const AUD={};function audio(k){if(!CFG.voz||!VOZ[k])return null;if(!AUD[k]){const a=new Audio(VOZ[k]);AUD[k]=a;const c=ac();if(c&&c.state==='running'){try{if(!an){an=c.createAnalyser();an.fftSize=512;anBuf=new Uint8Array(an.fftSize);an.connect(c.destination)}const s=c.createMediaElementSource(a);s.connect(an)}catch(e){}}}return AUD[k]}
const FALAS={rod1:'Nova rodada!',rod2:'Vamos lá, nova rodada!',rod3:'Valendo! Nova rodada!',dica1:'Atenção! Primeiras letras liberadas.',dica2:'Olha a dica! Primeiras letras liberadas.',seg1:'Valeu pelo novo seguidor!',seg2:'Obrigado por seguir!',seg3:'Mais um seguidor! Valeu!',seg4:'Valeu, meu irmão!',mvp1:'Esses foram os melhores da rodada. Parabéns!',mvp2:'Parabéns aos melhores da rodada!',rap1:'Rápido demais! Vou dificultar um pouco mais.',rap2:'Vocês estão voando! Vou dificultar.',rap3:'Assim eu vou ter que apelar!',fac1:'Ficou difícil, vou facilitar.',ac1:'Olha que esperto!',ac2:'Isso aí, campeão!',ac3:'Caraca, na mosca!',ult:'Última palavra! Quem vai fechar?',quase:'Quase! Faltou só um pouquinho.',pronto:'Preparados, porque eu nasci pronto!'};
const GRUPO={rod:['rod1','rod2','rod3'],dica:['dica1','dica2'],seg:['seg1','seg2','seg3','seg4'],mvp:['mvp1','mvp2'],rap:['rap1','rap2','rap3'],fac:['fac1'],acerto:['ac1','ac2','ac3'],ult:['ult'],quase:['quase'],pronto:['pronto']};
function fala(grupo,extra,prio){const g=GRUPO[grupo],k=g[Math.random()*g.length|0];if(prio==='alta')FQ=FQ.filter(f=>f.prio==='alta');else if(FQ.length>=2)return;FQ.push({txt:FALAS[k],key:k,extra:extra||'',prio});if(!falando)rodaFala()}
async function rodaFala(){falando=true;while(FQ.length){const f=FQ.shift();await dizer(f);if(FQ.length){talk(false);curAud=null;setCap('',false,false);await new Promise(r=>setTimeout(r,1100))}}falando=false;curAud=null;talk(false);showIdle()}
async function dizer(f){const a=audio(f.key);const full=f.txt+(f.extra?' '+f.extra:'');let dur=Math.max(2400,full.length*66+900);curAud=null;
 if(a){try{a.currentTime=0;await a.play();curAud=a;const d=isFinite(a.duration)?a.duration*1000:0;if(d>0)dur=d+450}catch(e){}}
 talk(true);clearTimeout(capTimer);const ini=Date.now(),tt=Math.max(900,dur*(curAud?.8:.72));
 await new Promise(res=>{const iv=setInterval(()=>{const p=Math.min(1,(Date.now()-ini)/tt);const n=Math.round(full.length*p);curChar=full[n-1]||' ';setCap(esc(full.slice(0,n)),p<1,true);if(Date.now()-ini>=dur){clearInterval(iv);res()}},45)})}
function aviso(t){if(falando)return;setCap(t,false,false);clearTimeout(capTimer);capTimer=setTimeout(showIdle,3800)}
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),3200)}
// ---------- usuários
const COLORS=['#7b2ff7','#ff2bd6','#00b4d8','#f77f00','#06d6a0','#ef476f','#3a86ff','#8338ec','#fb5607','#2ec4b6'];
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
function av(u,size){const c=COLORS[hash(u.id||u.name)%COLORS.length];const img=u.pic?`<img src="${esc(u.pic)}" onerror="this.remove()">`:'';return `<div class="av" style="width:${size}px;height:${size}px;font-size:${size*.5}px;background:${c}">${esc((u.name||'?')[0].toUpperCase())}${img}</div>`}
const S={fase:'inicio',rodada:0,nivel:1,cat:null,slots:[],users:new Map(),tot:new Map(),rod:new Map(),ult:new Map(),fim:0,ini:0,tempo:CFG.tempo,dicaFeita:false,usadas:[],seg:new Set(),nseg:0};
function user(d){let u=S.users.get(d.id);if(!u){u={id:d.id,name:d.name,pic:d.pic};S.users.set(d.id,u);$('np').textContent=S.users.size}if(d.name)u.name=d.name;if(d.pic)u.pic=d.pic;return u}
// ---------- rodada
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function proxCat(){if(S.usadas.length>=BANCO.length)S.usadas=[];const livres=BANCO.map((c,i)=>i).filter(i=>!S.usadas.includes(i));const i=livres[Math.random()*livres.length|0];S.usadas.push(i);return BANCO[i]}
function fitCat(){const el=$('catN');let sz=112;el.style.fontSize=sz+'px';while(el.scrollWidth>el.clientWidth&&sz>46){sz-=4;el.style.fontSize=sz+'px'}}
function dicaFrac(){return Math.max(.4,.7-.08*(S.nivel-1))}
function novaRodada(){S.fase='jogo';S.rodada++;S.rod=new Map();S.dicaFeita=false;S.dica2=false;S.ultDita=false;S.combo=null;S.cat=proxCat();S.tempo=Math.max(40,CFG.tempo-6*(S.nivel-1));
 const ws=shuffle(S.cat.words).slice(0,12);
 S.slots=ws.map(w=>{const alts=w.split('/');const keys=new Set();alts.forEach(a=>{const n=norm(a);keys.add(n);keys.add(sing(n))});return {show:alts[0],len:norm(alts[0]).length,keys,found:null,hint:0}});
 $('roundPill').textContent='RODADA '+S.rodada+(S.nivel>1?' · NÍVEL '+S.nivel:'');$('catN').textContent=S.cat.cat.toUpperCase();fitCat();$('over').className='';$('over').innerHTML='';
 S.ini=Date.now();S.fim=S.ini+S.tempo*1000;render();renderRk();SOM.nova();
 if(S.rodada===1)fala('pronto','');fala('rod','Palavras ligadas a '+S.cat.cat+'.')}
function achados(){return S.slots.filter(s=>s.found).length}
function setStat(){const f=12-achados();idleMsg=S.fase!=='jogo'?'🎵 Fim da rodada!':f===1?'🔥 Falta apenas 1 resposta!':'⌨️ Digite sua resposta no chat!';$('cnt').textContent=achados()+'/12';showIdle()}
function render(){$('slots').innerHTML=S.slots.map(s=>{if(s.found){const u=s.found.u;return `<div class="sl on">${av(u,68)}<div class="tx"><small>${esc(cut(u.name,18))}</small><b>${esc(s.show.toUpperCase())}</b></div><i class="pt">+${s.found.pts}</i></div>`}
  const ln=[...Array(s.len)].map((_,i)=>i<s.hint?`<em>${esc(s.show[i].toUpperCase())}</em>`:'<span></span>').join('');
  return `<div class="sl"><div class="len">${s.len}<small>LETRAS</small></div><div class="ln">${ln}</div></div>`}).join('');setStat()}
function ranking(){return [...S.tot.entries()].filter(e=>e[1].n>0).sort((a,b)=>b[1].p-a[1].p||b[1].n-a[1].n)}
function renderRk(){const r=ranking().slice(0,5);$('rk').innerHTML='<h4>🏆 TOP ACERTOS<span>1º A CHEGAR EM '+CFG.meta+' PTS GANHA</span></h4>'+(r.length?r.map(([id,v],i)=>{const u=S.users.get(id);const pc=Math.min(100,v.p/CFG.meta*100).toFixed(0);return `<div class="r" style="background-image:linear-gradient(90deg,rgba(63,208,168,.4) ${pc}%,rgba(255,255,255,.05) ${pc}%)"><b>${i+1}</b>${av(u,34)}<span class="n">${esc(u.name)}</span><span class="v">${v.p}<small>/${CFG.meta}</small> pts</span></div>`}).join(''):'<div class="vz">Acerte palavras para entrar aqui!</div>')}
// ---------- chat
function onChat(d){if(S.fase!=='jogo'||!d.text)return;const t=norm(d.text);if(!t||t.length>30)return;const novo=!S.users.has(d.id);const u=user(d);const agora=Date.now();if(agora-(S.ult.get(u.id)||0)<350)return;S.ult.set(u.id,agora);if(novo)toast('👋 '+cut(u.name,18)+' entrou no jogo!');
 const i=S.slots.findIndex(s=>!s.found&&(s.keys.has(t)||s.keys.has(sing(t))));if(i<0)return;
 const rest=Math.max(0,(S.fim-agora)/1000);const pts=Math.round(40+80*rest/S.tempo);S.slots[i].found={u,pts};
 const a=S.tot.get(u.id)||{n:0,p:0};a.n++;a.p+=pts;S.tot.set(u.id,a);const b=S.rod.get(u.id)||{n:0,p:0};b.n++;b.p+=pts;S.rod.set(u.id,b);
 const ag2=Date.now();if(S.combo&&S.combo.id===u.id&&ag2-S.combo.t<8000)S.combo.n++;else S.combo={id:u.id,n:1};S.combo.t=ag2;
 if(S.combo.n>=2){SOM.combo(S.combo.n+1);toast('🔥 COMBO x'+S.combo.n+' · '+cut(u.name,14))}else if(achados()===1)SOM.primeiro();else SOM.ding();
 render();renderRk();if(achados()===11&&!S.ultDita){S.ultDita=true;fala('ult','')}else if(!falando&&achados()<11&&Math.random()<.2&&Date.now()-(S.ultAc||0)>15000){S.ultAc=Date.now();fala('acerto','')}if(achados()>=12){S.fase='fim';setTimeout(fimRodada,1300)}}
function tick(){if(S.fase!=='jogo')return;const left=Math.max(0,S.fim-Date.now());const s=Math.ceil(left/1000);$('timT').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('ring').style.setProperty('--p',(left/(S.tempo*1000)*100).toFixed(1)+'%');$('tim').classList.toggle('low',s<=10);
 if(!S.dicaFeita&&left<=S.tempo*1000*dicaFrac()){S.dicaFeita=true;S.slots.forEach(x=>{if(!x.found)x.hint=1});render();SOM.dica();fala('dica','')}
 if(!S.dica2&&left<=S.tempo*1000*dicaFrac()*.55){S.dica2=true;S.slots.forEach(x=>{if(!x.found&&x.len>3)x.hint=2});render();SOM.dica()}
 if(s<=5&&s>0&&s!==S.lastTick){S.lastTick=s;SOM.tick()}
 if(left<=0){S.fase='fim';fimRodada()}}
setInterval(tick,250);
async function fimRodada(){S.fase='fim';$('tim').classList.remove('low');$('timT').textContent='0:00';$('ring').style.setProperty('--p','0%');setStat();
 const dur=Date.now()-S.ini,n=achados();if(n>=12)SOM.champ();else if(n>=8)SOM.win();else SOM.fim();
 const falt=S.slots.filter(s=>!s.found);
 const top=[...S.rod.entries()].sort((a,b)=>b[1].p-a[1].p).slice(0,3);
 const ord=[top[1],top[0],top[2]];
 const pod=ord.map((e,k)=>{if(!e)return '<div class="p"></div>';const u=S.users.get(e[0]);return `<div class="p">${k===1?'<span class="mvp">⭐ MVP</span>':''}<div style="display:flex;justify-content:center;padding-top:${k===1?18:0}px">${av(u,k===1?110:84)}</div><b>${esc(cut(u.name,14))}</b><i>${e[1].p} pts</i></div>`}).join('');
 const rk=ranking().slice(0,4).map(([id,v],i)=>`<div class="lr"><b>${i+1}</b>${av(S.users.get(id),38)}<span class="n">${esc(S.users.get(id).name)}</span><span class="v">${v.p}/${CFG.meta} pts</span></div>`).join('')||'<div class="lr"><span class="n">Ainda sem acertos</span></div>';
 const lid=ranking()[0],camp=lid&&lid[1].p>=CFG.meta?lid:null;if(camp)SOM.champ();
 let cf='<div class="confetti">';const cs=['#ff2bd6','#22e4ff','#ffd60a','#2bff88','#7c3aed'];if(n>=8||camp)for(let i=0;i<36;i++)cf+=`<i style="left:${Math.random()*1000}px;background:${cs[i%5]};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()}s"></i>`;cf+='</div>';
 $('over').innerHTML=`<div class="res">${cf}<div class="lg">${LOGO}GIGARISO</div>${camp?`<div class="camp">🏆 CAMPEÃO DA PARTIDA<b>${esc(cut(S.users.get(camp[0]).name,16))}</b><i>${camp[1].p} pts</i></div>`:''}<div class="t1">Rodada ${S.rodada} · ${esc(S.cat.cat)}</div><div class="t2">${n} de 12 palavras</div><div class="pod">${pod}</div>
  <div class="live2"><h5>👑 Pontos na partida · meta ${CFG.meta}</h5>${rk}</div>${falt.length?`<div class="falt">Faltaram: ${falt.slice(0,5).map(s=>esc(s.show)).join(', ')}${falt.length>5?'…':''}</div>`:''}<div class="prox">${camp?'Nova partida em':'Próxima rodada em'} <b id="pr">${CFG.prox}</b></div></div>`;
 $('over').className='on';
 if(camp){fala('mvp','CAMPEÃO: '+cut(S.users.get(camp[0]).name,16)+' · '+camp[1].p+' pts','alta')}
 else if(top.length){const u=S.users.get(top[0][0]);if(n>=9&&n<12)fala('quase','','alta');fala('mvp','MVP: '+cut(u.name,16)+' · '+top[0][1].p+' pts','alta')}
 if(n>=12&&dur<S.tempo*1000*.62&&S.nivel<4){S.nivel++;fala('rap','Nível '+S.nivel+'.','alta')}
 else if(n<=3&&S.nivel>1){S.nivel--;fala('fac','Nível '+S.nivel+'.','alta')}
 const espera=CFG.prox+(camp?6:0);for(let s=espera;s>0;s--){const e=$('pr');if(e)e.textContent=s;await wait(1000)}
 if(camp){S.tot=new Map();renderRk()}
 novaRodada()}
// ---------- alertas (só texto/legenda; agradecimento de seguidor tem a fala do Sorrisão)
function onFollow(u0){const u=user(u0);if(S.seg.has(u.id))return;S.seg.add(u.id);S.nseg++;SOM.combo(3);
 if(Date.now()-ultSeg>7000&&!falando){ultSeg=Date.now();fala('seg',cut(u.name,18))}else aviso('💜 Valeu, '+esc(cut(u.name,18))+', pelo novo seguidor!')}
function onGift(u0){const u=user(u0);SOM.presente();aviso('🎁 Obrigado pelo apoio, '+esc(cut(u.name,18))+'!')}
function onJoin(u0){const u=user(u0);toast('👋 '+cut(u.name,18)+' chegou na live!')}
// ---------- TikFinity / ponte
function parseUser(x){return {id:String(x.uniqueId||x.userId||x.user?.uniqueId||x.nickname||'anon'),name:x.nickname||x.user?.nickname||x.uniqueId||'Anônimo',pic:x.profilePictureUrl||x.user?.profilePictureUrl||(x.userDetails?.profilePictureUrls||[])[0]||''}}
function handle(raw){let m=raw;try{if(typeof m==='string')m=JSON.parse(m)}catch(e){return}const ev=(m.event||m.type||'').toLowerCase();const d=m.data||m;const u=parseUser(d);
 if(ev==='chat'||ev==='comment')onChat({...u,text:d.comment||d.text||''});
 else if(ev==='follow'||(ev==='social'&&/follow/i.test(d.displayType||d.label||'')))onFollow(u);
 else if(ev==='gift'){if(d.giftType===1&&!d.repeatEnd)return;onGift(u)}
 else if(ev==='member'||ev==='join')onJoin(u)}
function conectar(){const st=$('status');let ws;try{ws=new WebSocket(CFG.ws)}catch(e){setTimeout(conectar,3000);return}
 ws.onopen=()=>{st.classList.add('on');st.querySelector('span').textContent='TikFinity conectado'};ws.onmessage=e=>handle(e.data);
 ws.onclose=()=>{st.classList.remove('on');st.querySelector('span').textContent='TikFinity desconectado — tentando de novo...';setTimeout(conectar,3000)};ws.onerror=()=>{try{ws.close()}catch(e){}}}
if(!CFG.status)$('status').style.display='none';
// demo (tecla D) e pular rodada (N)
const BOTS=['Lucas_gamer','Bia.santos','Pedrão','Jujuzinha','Rafa77','Nanda_','Thiago.rj','Mari_fofa','Duda.lima','Kauã_09'];
function demoTick(){const n=BOTS[Math.random()*BOTS.length|0];const d={id:n,name:n,pic:''};if(S.fase==='jogo'&&Math.random()<.55){const f=S.slots.filter(s=>!s.found);if(f.length)onChat({...d,text:Math.random()<.85?f[Math.random()*f.length|0].show:'sei la'})}if(Math.random()<.02)onFollow({id:'seg'+Math.random(),name:BOTS[Math.random()*BOTS.length|0]+'_'});setTimeout(demoTick,450+Math.random()*1200)}
window.gigaChat=(nome,texto)=>onChat({id:nome,name:nome,pic:'',text:texto});
document.addEventListener('keydown',e=>{ac();if(e.key==='d'||e.key==='D'){if(!CFG.demo){CFG.demo=true;demoTick()}}if((e.key==='n'||e.key==='N')&&S.fase==='jogo')S.fim=Date.now()});
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);$('stage').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
if(CFG.demo)demoTick();
conectar();novaRodada();
